<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  />
  <title>Tính nhanh giá giảm</title>

  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Giảm giá" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png.PNG" />

  <style>
    :root{
      --text:#0f172a;
      --muted:#64748b;
      --blue:#2563eb;
      --blue-2:#60a5fa;
      --cyan:#06b6d4;
      --green:#16a34a;
      --red:#e11d48;
      --orange:#ea580c;
      --stroke:rgba(15,23,42,.08);
      --shadow:0 24px 70px rgba(15,23,42,.10);
      --shadow-soft:0 12px 30px rgba(15,23,42,.07);
      --wheel-row:58px;
      --wheel-visible:5;
      --wheel-height: calc(var(--wheel-row) * var(--wheel-visible));
      --main-gradient:
        radial-gradient(circle at top right, rgba(96,165,250,.18), transparent 26%),
        linear-gradient(135deg, #eaf3ff, #c4dcff 45%, #2563eb 125%);
      --body-bg:
        radial-gradient(circle at 10% 10%, rgba(147,197,253,.30), transparent 28%),
        radial-gradient(circle at 90% 0%, rgba(34,211,238,.12), transparent 22%),
        linear-gradient(180deg, #f8fbff 0%, #eef5fd 48%, #f9fbff 100%);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      width:100%;
      overflow-x:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:var(--body-bg);
      background-attachment:fixed;
    }

    body{
      padding:16px 14px 24px;
      position:relative;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.20), rgba(255,255,255,0)),
        radial-gradient(circle at center, transparent 0 40%, rgba(255,255,255,.03) 100%);
    }

    .wrap{
      max-width:500px;
      width:100%;
      margin:0 auto;
      position:relative;
      z-index:1;
    }

    .glow{
      position:absolute;
      width:160px;
      height:160px;
      border-radius:50%;
      filter:blur(48px);
      opacity:.24;
      pointer-events:none;
      z-index:0;
    }

    .glow.g1{
      top:36px;
      left:-34px;
      background:rgba(37,99,235,.18);
    }

    .glow.g2{
      top:150px;
      right:-40px;
      background:rgba(6,182,212,.12);
    }

    .hero{
      position:relative;
      padding:6px 4px 14px;
      z-index:1;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      color:var(--text);
      font-size:13px;
      font-weight:800;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:var(--shadow-soft);
      margin-bottom:12px;
    }

    .badge-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:linear-gradient(180deg, var(--blue-2), var(--cyan));
      box-shadow:0 0 0 5px rgba(96,165,250,.12);
    }

    .title{
      margin:0;
      font-size:34px;
      line-height:1.04;
      font-weight:900;
      letter-spacing:-1px;
      color:var(--text);
      text-shadow:0 6px 20px rgba(37,99,235,.05);
    }

    .shell{
      position:relative;
      border-radius:34px;
      padding:1px;
      background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.55));
      box-shadow:var(--shadow);
    }

    .card{
      position:relative;
      overflow:hidden;
      border-radius:33px;
      padding:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.72));
      backdrop-filter:blur(22px) saturate(130%);
      -webkit-backdrop-filter:blur(22px) saturate(130%);
      border:1px solid rgba(255,255,255,.75);
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0) 20%),
        radial-gradient(circle at top right, rgba(96,165,250,.10), transparent 28%);
    }

    .section{
      margin-bottom:18px;
      position:relative;
      z-index:1;
    }

    .label{
      display:block;
      margin-bottom:10px;
      padding-left:2px;
      font-size:13px;
      font-weight:800;
      color:var(--text);
      opacity:.9;
    }

    .input-wrap,
    .picker-button{
      position:relative;
      width:100%;
      border-radius:22px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(247,250,255,.94));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.90),
        0 10px 22px rgba(15,23,42,.05);
      transition:.2s ease;
    }

    .input-wrap:focus-within,
    .picker-button:focus{
      outline:none;
      border-color:rgba(37,99,235,.24);
      box-shadow:
        0 0 0 4px rgba(37,99,235,.10),
        0 12px 24px rgba(15,23,42,.06),
        inset 0 1px 0 rgba(255,255,255,.92);
    }

    .money-icon{
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      width:30px;
      height:30px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      font-weight:900;
      color:var(--blue);
      background:linear-gradient(180deg, rgba(37,99,235,.14), rgba(37,99,235,.08));
      border:1px solid rgba(37,99,235,.10);
    }

    .input{
      width:100%;
      height:64px;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text);
      font-size:26px;
      font-weight:900;
      letter-spacing:-.4px;
      padding:0 54px 0 56px;
      border-radius:22px;
    }

    .input::placeholder{
      color:var(--muted);
      font-weight:700;
    }

    .clear-btn{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%) scale(.9);
      width:34px;
      height:34px;
      border:none;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      color:var(--text);
      opacity:0;
      pointer-events:none;
      background:linear-gradient(180deg, rgba(15,23,42,.07), rgba(15,23,42,.04));
      border:1px solid rgba(15,23,42,.08);
      transition:opacity .18s ease, transform .18s ease;
      box-shadow:0 8px 16px rgba(15,23,42,.05);
    }

    .clear-btn.show{
      opacity:1;
      pointer-events:auto;
      transform:translateY(-50%) scale(1);
    }

    .clear-btn:active{
      transform:translateY(-50%) scale(.96);
    }

    .picker-button{
      min-height:64px;
      padding:0 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
    }

    .picker-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .picker-icon{
      width:32px;
      height:32px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:15px;
      font-weight:900;
      color:#fff7ed;
      background:linear-gradient(180deg, rgba(234,88,12,.78), rgba(234,88,12,.54));
      border:1px solid rgba(234,88,12,.16);
      box-shadow:0 8px 18px rgba(234,88,12,.10);
    }

    .picker-title{
      font-size:11px;
      color:var(--muted);
      font-weight:800;
      margin-bottom:2px;
      text-align:left;
    }

    .picker-value{
      font-size:22px;
      font-weight:900;
      color:var(--text);
      line-height:1;
      text-align:left;
    }

    .picker-arrow{
      color:var(--muted);
      font-size:24px;
      line-height:1;
    }

    .segment{
      margin-top:18px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      padding:6px;
      border-radius:20px;
      background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(245,249,255,.92));
      border:1px solid var(--stroke);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.92);
      position:relative;
      z-index:1;
    }

    .segment-btn{
      height:48px;
      border:none;
      border-radius:15px;
      background:transparent;
      color:var(--muted);
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      transition:.18s ease;
    }

    .segment-btn.active{
      color:#fff;
      background:linear-gradient(180deg, var(--blue), #1d4ed8);
      box-shadow:
        0 10px 22px rgba(37,99,235,.18),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    .panel{
      display:none;
      position:relative;
      z-index:1;
    }

    .panel.active{
      display:block;
    }

    .result-card,
    .list-card{
      margin-top:18px;
      border-radius:26px;
      padding:16px;
      background:linear-gradient(180deg, rgba(255,255,255,.90), rgba(250,252,255,.84));
      border:1px solid var(--stroke);
      box-shadow:var(--shadow-soft);
    }

    .result-top,
    .list-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .result-title,
    .list-title{
      margin:0;
      font-size:15px;
      font-weight:900;
      color:var(--text);
      letter-spacing:-.2px;
    }

    .selected-tag{
      padding:8px 12px;
      border-radius:999px;
      white-space:nowrap;
      font-size:12px;
      font-weight:900;
      color:var(--blue);
      background:linear-gradient(180deg, rgba(37,99,235,.10), rgba(37,99,235,.06));
      border:1px solid rgba(37,99,235,.10);
    }

    .result-main{
      position:relative;
      overflow:hidden;
      border-radius:28px;
      padding:22px 18px;
      margin-bottom:12px;
      background:var(--main-gradient);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.40),
        0 20px 38px rgba(37,99,235,.14);
    }

    .result-main::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 35%),
        radial-gradient(circle at top right, rgba(255,255,255,.26), transparent 26%);
      pointer-events:none;
    }

    .result-main::after{
      content:"";
      position:absolute;
      width:160px;
      height:160px;
      border-radius:50%;
      right:-36px;
      top:-50px;
      background:rgba(255,255,255,.18);
      filter:blur(8px);
    }

    .result-main-label{
      position:relative;
      z-index:1;
      font-size:12px;
      color:rgba(15,23,42,.72);
      font-weight:900;
      margin-bottom:8px;
      letter-spacing:.2px;
    }

    .result-main-value{
      position:relative;
      z-index:1;
      font-size:42px;
      line-height:1.02;
      font-weight:900;
      letter-spacing:-1.2px;
      color:#0b1220;
      word-break:break-word;
      text-shadow:0 2px 0 rgba(255,255,255,.26);
    }

    .mini-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .mini{
      border-radius:20px;
      padding:14px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(247,250,255,.86));
      box-shadow:0 8px 18px rgba(15,23,42,.04);
    }

    .mini.green{
      background:linear-gradient(180deg, rgba(22,163,74,.10), rgba(255,255,255,.92));
      border-color:rgba(22,163,74,.12);
    }

    .mini.red{
      background:linear-gradient(180deg, rgba(225,29,72,.08), rgba(255,255,255,.92));
      border-color:rgba(225,29,72,.10);
    }

    .mini-label{
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      margin-bottom:8px;
    }

    .mini-value{
      font-size:22px;
      line-height:1.1;
      font-weight:900;
      letter-spacing:-.4px;
      word-break:break-word;
    }

    .mini.green .mini-value{ color:var(--green); }
    .mini.red .mini-value{ color:var(--red); }

    .price-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    .price-item{
      padding:14px;
      border-radius:18px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(247,250,255,.86));
      display:flex;
      flex-direction:column;
      gap:8px;
      cursor:pointer;
      transition:.18s ease;
      box-shadow:0 8px 16px rgba(15,23,42,.04);
      min-width:0;
    }

    .price-item.active{
      transform:translateY(-1px);
      border-color:rgba(37,99,235,.18);
      background:linear-gradient(180deg, rgba(37,99,235,.10), rgba(255,255,255,.90));
      box-shadow:
        0 12px 24px rgba(37,99,235,.10),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    .price-item .p{
      font-size:12px;
      color:var(--muted);
      font-weight:800;
    }

    .price-item .v{
      font-size:18px;
      font-weight:900;
      color:var(--text);
      line-height:1.15;
      letter-spacing:-.3px;
      word-break:break-word;
    }

    .table-wrap{
      display:grid;
      gap:10px;
      max-height:500px;
      overflow:auto;
      padding-right:2px;
      overscroll-behavior:contain;
    }

    .table-wrap::-webkit-scrollbar{
      width:6px;
    }

    .table-wrap::-webkit-scrollbar-thumb{
      background:rgba(15,23,42,.10);
      border-radius:999px;
    }

    .table-item{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      align-items:center;
      padding:13px 14px;
      border-radius:18px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(247,250,255,.86));
      min-width:0;
    }

    .table-k{
      font-size:11px;
      color:var(--muted);
      font-weight:800;
      margin-bottom:5px;
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    .table-v{
      font-size:18px;
      font-weight:900;
      color:var(--text);
      line-height:1.12;
      letter-spacing:-.3px;
      word-break:break-word;
    }

    .modal{
      position:fixed;
      inset:0;
      display:none;
      z-index:9999;
    }

    .modal.show{
      display:block;
    }

    .backdrop{
      position:absolute;
      inset:0;
      background:rgba(15,23,42,.18);
      opacity:0;
      transition:opacity .22s ease;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .sheet{
      position:absolute;
      left:12px;
      right:12px;
      bottom:12px;
      overflow:hidden;
      border-radius:30px;
      border:1px solid rgba(255,255,255,.85);
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(245,249,255,.96));
      box-shadow:0 26px 60px rgba(15,23,42,.14);
      transform:translateY(28px);
      opacity:0;
      transition:transform .22s ease, opacity .22s ease;
    }

    .modal.show .backdrop{
      opacity:1;
    }

    .modal.show .sheet{
      transform:translateY(0);
      opacity:1;
    }

    .sheet-grabber{
      width:50px;
      height:5px;
      border-radius:999px;
      background:rgba(15,23,42,.12);
      margin:10px auto 4px;
    }

    .sheet-head{
      text-align:center;
      font-size:22px;
      font-weight:900;
      color:var(--text);
      padding:8px 16px 6px;
      letter-spacing:-.4px;
    }

    .wheel-wrap{
      position:relative;
      height:var(--wheel-height);
      margin:4px 14px 10px;
      overflow:hidden;
      border-radius:24px;
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(247,250,255,.96));
      border:1px solid var(--stroke);
      perspective:1000px;
      transform-style:preserve-3d;
    }

    .wheel-fade-top,
    .wheel-fade-bottom{
      position:absolute;
      left:0;
      right:0;
      height:100px;
      z-index:4;
      pointer-events:none;
    }

    .wheel-fade-top{
      top:0;
      background:linear-gradient(to bottom, rgba(255,255,255,.98), rgba(255,255,255,0));
    }

    .wheel-fade-bottom{
      bottom:0;
      background:linear-gradient(to top, rgba(255,255,255,.98), rgba(255,255,255,0));
    }

    .wheel-center{
      position:absolute;
      left:10px;
      right:10px;
      top:50%;
      height:var(--wheel-row);
      transform:translateY(-50%);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(37,99,235,.10), rgba(6,182,212,.06));
      border:1px solid rgba(37,99,235,.10);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        0 10px 24px rgba(37,99,235,.08);
      z-index:3;
      pointer-events:none;
    }

    .wheel{
      position:relative;
      z-index:2;
      height:100%;
      overflow-y:auto;
      overflow-x:hidden;
      padding:calc(var(--wheel-row) * 2) 0;
      scroll-snap-type:y mandatory;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior-y:contain;
      touch-action:pan-y;
    }

    .wheel::-webkit-scrollbar{
      display:none;
    }

    .wheel-item{
      height:var(--wheel-row);
      display:flex;
      align-items:center;
      justify-content:center;
      scroll-snap-align:center;
      user-select:none;
      font-size:24px;
      font-weight:800;
      color:var(--muted);
      letter-spacing:-.3px;
      opacity:.18;
      transform:translateZ(0) scale(.8);
      filter:blur(.5px);
      transition:
        transform .14s cubic-bezier(.2,.8,.2,1),
        opacity .14s ease,
        color .14s ease,
        filter .14s ease;
      will-change:transform, opacity, filter;
    }

    .wheel-item.active{
      color:var(--text);
      opacity:1;
      transform:translateZ(26px) scale(1);
      filter:none;
    }

    .wheel-wrap.shake-soft .wheel-center{
      animation:wheelShakeSoft .16s ease;
    }

    .wheel-wrap.shake-strong .wheel-center{
      animation:wheelShakeStrong .22s ease;
    }

    @keyframes wheelShakeSoft{
      0% { transform:translateY(-50%) translateX(0); }
      30% { transform:translateY(-50%) translateX(-1px); }
      60% { transform:translateY(-50%) translateX(1px); }
      100% { transform:translateY(-50%) translateX(0); }
    }

    @keyframes wheelShakeStrong{
      0% { transform:translateY(-50%) translateX(0); }
      20% { transform:translateY(-50%) translateX(-3px); }
      40% { transform:translateY(-50%) translateX(3px); }
      65% { transform:translateY(-50%) translateX(-2px); }
      85% { transform:translateY(-50%) translateX(1px); }
      100% { transform:translateY(-50%) translateX(0); }
    }

    .sheet-actions{
      padding:10px 16px calc(16px + env(safe-area-inset-bottom));
      border-top:1px solid var(--stroke);
      background:rgba(255,255,255,.55);
    }

    .confirm-btn{
      width:100%;
      height:58px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      color:#fff;
      font-size:18px;
      font-weight:900;
      letter-spacing:-.2px;
      background:linear-gradient(180deg, var(--blue), #1d4ed8);
      box-shadow:
        0 16px 30px rgba(37,99,235,.18),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    .confirm-btn:active{
      transform:scale(.995);
    }

    @media (max-width:390px){
      .title{ font-size:30px; }
      .result-main-value{ font-size:36px; }
      .mini-value{ font-size:19px; }
      .price-item .v,
      .table-v{ font-size:16px; }
      .input{ font-size:23px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="hero">
      <div class="badge">
        <span class="badge-dot"></span>
        Luxury
      </div>
      <h1 class="title">Tính giá giảm</h1>
    </div>

    <div class="shell">
      <div class="card">
        <div class="section">
          <label class="label" for="originalPrice">Giá gốc</label>
          <div class="input-wrap">
            <div class="money-icon">₫</div>
            <input
              id="originalPrice"
              class="input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="Nhập giá"
              autocomplete="off"
            />
            <button class="clear-btn" id="clearPriceBtn" type="button" aria-label="Xoá nhanh">×</button>
          </div>
        </div>

        <div class="section">
          <label class="label">Mức giảm</label>
          <button class="picker-button" id="openPicker" type="button">
            <div class="picker-left">
              <div class="picker-icon">%</div>
              <div>
                <div class="picker-title">Đang chọn</div>
                <div class="picker-value" id="selectedDiscountText">20%</div>
              </div>
            </div>
            <div class="picker-arrow">›</div>
          </button>
        </div>

        <div class="segment">
          <button class="segment-btn active" id="tabQuickBtn" type="button">Nhanh</button>
          <button class="segment-btn" id="tabTableBtn" type="button">Bảng</button>
        </div>

        <div class="panel active" id="panelQuick">
          <div class="result-card">
            <div class="result-top">
              <h2 class="result-title">Kết quả</h2>
              <div class="selected-tag" id="selectedTag">Giảm 20%</div>
            </div>

            <div class="result-main">
              <div class="result-main-label">Giá sau giảm</div>
              <div class="result-main-value" id="finalPrice">0 ₫</div>
            </div>

            <div class="mini-grid">
              <div class="mini green">
                <div class="mini-label">Tiền giảm</div>
                <div class="mini-value" id="discountAmount">0 ₫</div>
              </div>
              <div class="mini red">
                <div class="mini-label">Còn lại</div>
                <div class="mini-value" id="remainPercent">80%</div>
              </div>
            </div>

            <div class="list-card">
              <div class="list-head">
                <h3 class="list-title">Mức khác</h3>
                <div class="selected-tag">Chọn nhanh</div>
              </div>
              <div class="price-grid" id="priceGrid"></div>
            </div>
          </div>
        </div>

        <div class="panel" id="panelTable">
          <div class="list-card">
            <div class="list-head">
              <h3 class="list-title">20k–100k</h3>
              <div class="selected-tag" id="tableTag">Giảm 20%</div>
            </div>
            <div class="table-wrap" id="rangeTable"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="pickerModal" aria-hidden="true">
    <div class="backdrop" id="closePicker"></div>

    <div class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">Mức giảm</div>

      <div class="wheel-wrap">
        <div class="wheel-fade-top"></div>
        <div class="wheel-fade-bottom"></div>
        <div class="wheel-center"></div>
        <div class="wheel" id="wheel"></div>
      </div>

      <div class="sheet-actions">
        <button class="confirm-btn" id="confirmPicker" type="button">Xác nhận</button>
      </div>
    </div>
  </div>

  <script>
    const originalPriceInput = document.getElementById("originalPrice");
    const clearPriceBtn = document.getElementById("clearPriceBtn");

    const selectedDiscountText = document.getElementById("selectedDiscountText");
    const selectedTag = document.getElementById("selectedTag");
    const tableTag = document.getElementById("tableTag");
    const discountAmountEl = document.getElementById("discountAmount");
    const finalPriceEl = document.getElementById("finalPrice");
    const remainPercentEl = document.getElementById("remainPercent");
    const priceGrid = document.getElementById("priceGrid");
    const rangeTable = document.getElementById("rangeTable");

    const tabQuickBtn = document.getElementById("tabQuickBtn");
    const tabTableBtn = document.getElementById("tabTableBtn");
    const panelQuick = document.getElementById("panelQuick");
    const panelTable = document.getElementById("panelTable");

    const openPickerBtn = document.getElementById("openPicker");
    const pickerModal = document.getElementById("pickerModal");
    const closePicker = document.getElementById("closePicker");
    const confirmPicker = document.getElementById("confirmPicker");
    const wheel = document.getElementById("wheel");
    const wheelWrap = document.querySelector(".wheel-wrap");

    const discounts = [20, 25, 30, 35, 40, 45, 50, 55, 60];

    let selectedDiscount = 20;
    let tempDiscount = 20;
    let wheelScrollTimer = null;
    let settleTimer = null;
    let lastHapticValue = tempDiscount;
    let rafLock = false;
    let isProgrammaticScroll = false;
    let programmaticScrollUnlock = null;

    function formatCurrency(number) {
      return new Intl.NumberFormat("vi-VN").format(Math.round(number)) + " ₫";
    }

    function rawNumber(value) {
      return value.replace(/\D/g, "");
    }

    function formatInputNumber(value) {
      const raw = rawNumber(value);
      if (!raw) return "";
      return new Intl.NumberFormat("vi-VN").format(Number(raw));
    }

    function getOriginalPrice() {
      return Number(rawNumber(originalPriceInput.value)) || 0;
    }

    function updateClearButton() {
      clearPriceBtn.classList.toggle("show", rawNumber(originalPriceInput.value).length > 0);
    }

    function setActiveTab(tabName) {
      const isQuick = tabName === "quick";
      tabQuickBtn.classList.toggle("active", isQuick);
      tabTableBtn.classList.toggle("active", !isQuick);
      panelQuick.classList.toggle("active", isQuick);
      panelTable.classList.toggle("active", !isQuick);
    }

    function updateSummary() {
      const price = getOriginalPrice();
      const discountAmount = price * selectedDiscount / 100;
      const finalPrice = price - discountAmount;
      const remainPercent = 100 - selectedDiscount;

      selectedDiscountText.textContent = selectedDiscount + "%";
      selectedTag.textContent = "Giảm " + selectedDiscount + "%";
      tableTag.textContent = "Giảm " + selectedDiscount + "%";
      discountAmountEl.textContent = formatCurrency(discountAmount);
      finalPriceEl.textContent = formatCurrency(finalPrice);
      remainPercentEl.textContent = remainPercent + "%";

      renderPriceGrid(price);
      renderRangeTable();
      updateClearButton();
    }

    function renderPriceGrid(price) {
      priceGrid.innerHTML = "";

      discounts.forEach(percent => {
        const discounted = price - (price * percent / 100);

        const item = document.createElement("div");
        item.className = "price-item" + (percent === selectedDiscount ? " active" : "");

        const p = document.createElement("div");
        p.className = "p";
        p.textContent = "Giảm " + percent + "%";

        const v = document.createElement("div");
        v.className = "v";
        v.textContent = formatCurrency(discounted);

        item.appendChild(p);
        item.appendChild(v);

        item.addEventListener("click", () => {
          selectedDiscount = percent;
          tempDiscount = percent;
          lastHapticValue = percent;
          updateSummary();
        });

        priceGrid.appendChild(item);
      });
    }

    function renderRangeTable() {
      rangeTable.innerHTML = "";

      for (let price = 20000; price <= 100000; price += 1000) {
        const discounted = price - (price * selectedDiscount / 100);

        const item = document.createElement("div");
        item.className = "table-item";

        const left = document.createElement("div");
        left.innerHTML = `
          <div class="table-k">Giá gốc</div>
          <div class="table-v">${formatCurrency(price)}</div>
        `;

        const right = document.createElement("div");
        right.innerHTML = `
          <div class="table-k">Sau giảm ${selectedDiscount}%</div>
          <div class="table-v">${formatCurrency(discounted)}</div>
        `;

        item.appendChild(left);
        item.appendChild(right);
        rangeTable.appendChild(item);
      }
    }

    function buildWheel() {
      wheel.innerHTML = "";

      discounts.forEach(percent => {
        const item = document.createElement("div");
        item.className = "wheel-item";
        item.dataset.value = percent;
        item.textContent = percent + "%";
        wheel.appendChild(item);
      });

      highlightWheel();
    }

    function getRowHeight() {
      return 58;
    }

    function vibrateTick(strong = false) {
      if (navigator.vibrate) {
        navigator.vibrate(strong ? [12] : [7]);
      }
    }

    function shakeWheelCenter(strong = false) {
      wheelWrap.classList.remove("shake-soft", "shake-strong");
      void wheelWrap.offsetWidth;
      wheelWrap.classList.add(strong ? "shake-strong" : "shake-soft");
    }

    function triggerWheelFeedback(value, strong = false) {
      if (value !== lastHapticValue) {
        vibrateTick(strong);
        shakeWheelCenter(strong);
        lastHapticValue = value;
      }
    }

    function beginProgrammaticScrollLock(duration = 260) {
      isProgrammaticScroll = true;
      clearTimeout(programmaticScrollUnlock);
      programmaticScrollUnlock = setTimeout(() => {
        isProgrammaticScroll = false;
      }, duration);
    }

    function scrollWheelToValue(value, smooth = true) {
      const index = discounts.indexOf(value);
      if (index < 0) return;

      const top = index * getRowHeight();
      beginProgrammaticScrollLock(smooth ? 320 : 80);

      wheel.scrollTo({
        top,
        behavior: smooth ? "smooth" : "auto"
      });

      tempDiscount = value;
      highlightWheel();
      if (smooth) {
        triggerWheelFeedback(value, true);
      }
    }

    function getNearestIndexFromScroll() {
      const rowHeight = getRowHeight();
      const index = Math.round(wheel.scrollTop / rowHeight);
      return Math.max(0, Math.min(discounts.length - 1, index));
    }

    function getNearestValueFromScroll() {
      return discounts[getNearestIndexFromScroll()];
    }

    function snapWheel(strong = true) {
      const value = getNearestValueFromScroll();
      tempDiscount = value;

      const index = discounts.indexOf(value);
      const targetTop = index * getRowHeight();

      beginProgrammaticScrollLock(320);
      wheel.scrollTo({
        top: targetTop,
        behavior: "smooth"
      });

      highlightWheel();
      triggerWheelFeedback(value, strong);
    }

    function highlightWheel() {
      const items = wheel.querySelectorAll(".wheel-item");
      const activeIndex = discounts.indexOf(tempDiscount);

      items.forEach((item, index) => {
        const value = Number(item.dataset.value);
        const distance = Math.abs(index - activeIndex);

        item.classList.toggle("active", value === tempDiscount);

        if (distance === 0) {
          item.style.transform = "translateZ(26px) scale(1)";
          item.style.opacity = "1";
          item.style.filter = "blur(0)";
        } else if (distance === 1) {
          item.style.transform = "translateZ(12px) scale(.93)";
          item.style.opacity = ".64";
          item.style.filter = "blur(.12px)";
        } else if (distance === 2) {
          item.style.transform = "translateZ(4px) scale(.86)";
          item.style.opacity = ".32";
          item.style.filter = "blur(.28px)";
        } else {
          item.style.transform = "translateZ(0) scale(.8)";
          item.style.opacity = ".14";
          item.style.filter = "blur(.5px)";
        }
      });
    }

    function openModal() {
      pickerModal.classList.add("show");
      pickerModal.setAttribute("aria-hidden", "false");
      tempDiscount = selectedDiscount;
      lastHapticValue = selectedDiscount;
      highlightWheel();

      setTimeout(() => {
        scrollWheelToValue(selectedDiscount, false);
      }, 10);
    }

    function closeModalFunc() {
      pickerModal.classList.remove("show");
      pickerModal.setAttribute("aria-hidden", "true");
    }

    originalPriceInput.addEventListener("input", () => {
      originalPriceInput.value = formatInputNumber(originalPriceInput.value);
      updateSummary();
    });

    clearPriceBtn.addEventListener("click", () => {
      originalPriceInput.value = "";
      updateSummary();
      originalPriceInput.focus();
    });

    tabQuickBtn.addEventListener("click", () => setActiveTab("quick"));
    tabTableBtn.addEventListener("click", () => setActiveTab("table"));

    openPickerBtn.addEventListener("click", openModal);
    closePicker.addEventListener("click", closeModalFunc);

    confirmPicker.addEventListener("click", () => {
      selectedDiscount = tempDiscount;
      lastHapticValue = tempDiscount;
      updateSummary();
      closeModalFunc();
    });

    wheel.addEventListener("scroll", () => {
      if (isProgrammaticScroll) return;
      if (rafLock) return;

      rafLock = true;
      requestAnimationFrame(() => {
        tempDiscount = getNearestValueFromScroll();
        highlightWheel();
        triggerWheelFeedback(tempDiscount, false);
        rafLock = false;
      });

      clearTimeout(wheelScrollTimer);
      clearTimeout(settleTimer);

      wheelScrollTimer = setTimeout(() => {
        snapWheel(true);
      }, 90);

      settleTimer = setTimeout(() => {
        snapWheel(true);
      }, 170);
    }, { passive: true });

    wheel.addEventListener("touchend", () => {
      setTimeout(() => {
        snapWheel(true);
      }, 40);
    }, { passive: true });

    wheel.addEventListener("pointerup", () => {
      setTimeout(() => {
        snapWheel(true);
      }, 40);
    }, { passive: true });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && pickerModal.classList.contains("show")) {
        closeModalFunc();
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }

    buildWheel();
    setActiveTab("quick");
    updateSummary();
  </script>
</body>
</html>
